name: Deploy standalone portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # A separate queue avoids a stale historical deployment blocking current fixes.
  group: portfolio-pages-current
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build downloadable project report PDF
        # Remote evidence download is useful, but must not stop HTML corrections from going live.
        continue-on-error: true
        run: |
          python -m pip install --quiet reportlab pypdf beautifulsoup4 pillow cairosvg
          python scripts/build_scientific_reports.py
          test -s build/fluoroscopy-case-study.pdf
          test -s build/camera-calibration-case-study.pdf
          test -s build/clap-zero-shot-case-study.pdf
          test -s build/flag-intelligence-case-study.pdf
          test -s build/python-cardgame-case-study.pdf
          test -s build/monstage-case-study.pdf
          test -s build/visionlab-case-study.pdf
          python - <<'PY'
          from pypdf import PdfReader
          for path, expected in [
            ("build/fluoroscopy-case-study.pdf", ["Abstract", "Nomenclature", "Methodology", "Experimental results", "References", "Otsu", "Geurts", "0.501", "0.876"]),
            ("build/camera-calibration-case-study.pdf", ["Abstract", "Nomenclature", "Methodology", "Experimental results", "References", "Zhang", "OpenCV", "0.434", "0.352"]),
            ("build/clap-zero-shot-case-study.pdf", ["Abstract", "Nomenclature", "Methodology", "Experimental results", "References", "Piczak", "Wu", "Gemmeke", "91.15", "83.05"]),
            ("build/flag-intelligence-case-study.pdf", ["Abstract", "References", "MobileNet", "19.61", "27.45"]),
            ("build/python-cardgame-case-study.pdf", ["Abstract", "References", "Pygame", "0.59", "0.95"]),
            ("build/monstage-case-study.pdf", ["Abstract", "References", "Cloudflare", "TypeScript"]),
            ("build/visionlab-case-study.pdf", ["Abstract", "References", "8.64", "1.44", "37"])
          ]:
              reader = PdfReader(path)
              text = " ".join((page.extract_text() or "") for page in reader.pages)
              assert len(reader.pages) >= 3, f"{path} is unexpectedly short"
              for term in expected:
                  assert term in text, f"{path}: missing {term}"
              print(f"Validated {path}: {len(reader.pages)} illustrated pages")
          PY
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path("build/fluoroscopy-case-study.pdf")
          reader = PdfReader(str(pdf))
          report = " ".join(" ".join(page.extract_text().split()) for page in reader.pages)
          required = ["Abstract", "Keywords", "Project information", "Nomenclature",
                      "1.0 Introduction", "3.0 Methodology", "4.2 Frame-by-frame results",
                      "5.0 Discussion and conclusion"]
          for heading in required:
              assert heading in report, f"PDF missing required section: {heading}"
          assert report.index("Project information") < report.index("Nomenclature") < report.index("1.0 Introduction")
          assert len(reader.pages) >= 4, "PDF report unexpectedly short"
          print(f"Validated downloadable report: {len(reader.pages)} pages, {pdf.stat().st_size} bytes")
          PY
      - name: Build and validate Harvard CV
        continue-on-error: true
        run: |
          python scripts/build_harvard_cv.py
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path("build/Denos_Kume_Harvard_CV.pdf")
          assert pdf.exists() and pdf.stat().st_size > 3000
          reader = PdfReader(str(pdf))
          assert len(reader.pages) == 1, "Harvard CV must fit exactly one page"
          page = reader.pages[0]
          assert abs(float(page.mediabox.width) - 595.28) < 1
          assert abs(float(page.mediabox.height) - 841.89) < 1
          text = " ".join((page.extract_text() or "").split())
          for required in (
              "Denos Kume", "Centrale Nantes", "Kristu Jayanti University",
              "RWS TrainAI", "Unified Mentor", "Data Science",
              "microcontroller hardware interfacing", "Business Intelligence",
              "February 2027", "Microcatheter Segmentation",
          ):
              assert required.lower() in text.lower(), f"Harvard PDF missing {required}"
          assert len(page.get("/Annots", [])) >= 3, "CV links are not clickable"
          assert "Baccalaureate" not in text and "Baccalauréat" not in text, "Secondary school should be excluded from internship CV"
          assert "Computer Vision & Image Processing" in text, "Missing focused Data Science direction"
          assert "Data Analysis" in text, "Missing secondary direction"
          assert "MonStage" not in text, "MonStage must not appear in the selected CV projects"
          assert "Microcatheter Segmentation" in text, "Missing selected computer vision project"
          assert "Feb - Apr 2026" in text, "CV project dates must be February–April 2026"
          assert "Master 1 project" in text and "Nantes, France (3 months)" in text, "CV project affiliation and duration must be visible"
          assert "Microcatheter Segmentation in Fluoroscopy | Python" not in text, "Project heading must not include technology tags"
          assert "CERTIFICATIONS" not in text.upper(), "CV certifications section should be removed"
          assert "Google Advanced Data Analytics" not in text, "Removed certification must not appear"
          assert "SQL Certification Course" not in text, "Removed certification must not appear"
          assert "EXPERIENCE" in text and "SELECTED PROJECTS" in text, "Missing reference sections"
          assert text.index("EDUCATION") < text.index("EXPERIENCE") < text.index("SELECTED PROJECTS") < text.index("TECHNICAL SKILLS"), "Incorrect reference CV section order"
          import json
          cv = json.loads(Path("cv-data.json").read_text(encoding="utf-8"))
          assert len(cv["education"]) == 2, "Show only higher education"
          assert cv["education"][0]["courses"] == "Artificial Intelligence | Machine Learning | Numerical Optimization | Data Analysis | Image Processing", "MSc coursework must match its description"
          assert cv["education"][1]["courses"] == "Programming | Database Systems | Data Analysis | Digital Electronics | Embedded Systems", "Bachelor coursework must match its description"
          assert "Digital Electronics" in text and "Embedded Systems" in text, "Bachelor electronics coursework must appear in the PDF"
          assert "Artificial Intelligence" in text and "Numerical Optimization" in text, "MSc AI and optimization coursework must appear in the PDF"
          assert len(cv["projects"]) == 1, "CV should showcase only one selected project"
          assert all(len(entry["bullets"]) == 4 for entry in cv["experience"] + cv["projects"]), "Every experience and selected project needs exactly 4 bullets"
          assert not any("MonStage" in entry["title"] for entry in cv["projects"])
          assert cv["career_headline"] == "Data Science | Computer Vision & Image Processing | Data Analysis"
          assert "certifications" not in cv, "CV data must not contain removed certifications"
          assert len(cv["experience"]) == 2
          assert all("organization" in job for job in cv["experience"]), "Experience affiliations must be present"
          assert all("|" not in job["title"] for job in cv["experience"]), "Job titles must not include employer and location"
          assert "Unified Mentor Pvt. Ltd." in text and "Bangalore, India" in text, "Missing internship affiliation and location"
          assert "RWS TrainAI" in text and "Remote (3 months)" in text, "Remote freelance affiliation and duration missing"
          assert "Sep - Dec 2024" in text and "Aug - Oct 2026" in text, "Experience date ranges must appear"
          assert cv["experience"][0]["dates"] == "Sep - Dec 2024", "Dates at right must not contain a month count"
          assert cv["experience"][1]["dates"] == "Aug - Oct 2026", "Dates at right must not contain a month count"
          assert all(job["organization"].endswith("(3 months)") for job in cv["experience"]), "Month count belongs on affiliation line, like the selected project"
          assert "Bangalore, India (3 months)" in text, "Missing duration in Unified Mentor affiliation"
          assert "Final-year Bachelor internship" in text, "Must retain Bachelor final-year internship qualification"
          assert "Final-year Bachelor internship" in cv["experience"][0]["summary"], "Preserve original summary data"
          print(f"Validated one-page text-based A4 Harvard CV: {len(text)} extracted characters")
          PY
      - name: Validate and prepare static site
        run: |
          node --check app.js
          node --check harvard-cv.js
          node --check contact-form.js
          node --check home-credentials.js
          node --check content.js
          node --check fluoroscopy-case-study.js
          node --check scientific-case-studies.js
          node --check software-case-studies.js
          node --check lab/workspace.js
          node --check lab/worker.js
          python -c 'from pathlib import Path; import re; html=Path("index.html").read_text(); Path("/tmp/portfolio-inline.js").write_text("\n".join(re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.I)), encoding="utf-8")'
          node --check /tmp/portfolio-inline.js
          # Both additional project pages reuse the fluoroscopy report structure.
          python - <<'PY'
          from pathlib import Path
          import subprocess
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'scientific-case-studies.js?v=' in html
          assert 'scientific-case-studies.css?v=' in html
          assert 'renderScientificCaseStudy(p.id)' in html and 'initScientificCaseStudy()' in html
          for slug in ('camera-calibration', 'clap-zero-shot'):
              assert "#/projects/" + slug in html
          script = """
          global.window=globalThis;
          require('./scientific-case-studies.js');
          require('./software-case-studies.js');
          for (const id of [2,3,4,5,6,7]) {
            const markup=window.renderScientificCaseStudy(id);
            if ((markup.match(/data-sc-tab=/g)||[]).length!==3 ||
                (markup.match(/fl-index-figure/g)||[]).length!==(id===2?6:id===3?8:2) ||
                !markup.includes('Abstract') || !markup.includes('Nomenclature') ||
                !markup.includes('r-results') ||
                !markup.includes('data-sc-action="save"') ||
                (id===3 && (!markup.includes('prompt_strategy_comparison_table.png') ||
                            !markup.includes('topk_accuracy_table.png') ||
                            !markup.includes('classwise_accuracy_tables.png') ||
                            !markup.includes('published_classifier_comparison_table.png') ||
                            markup.includes('ordered by descending Top-1 accuracy'))))
              throw new Error('Incomplete scientific case study '+id);
          }
          """
          subprocess.run(["node","-e",script],check=True)
          print("All six scientific case-study pages and their three tabs validated.")
          PY
          # Citations must resolve to bibliography entries in every project's Report tab.
          python - <<'PY'
          import re, subprocess
          script = """
          global.window=globalThis;
          require('./fluoroscopy-case-study.js');
          const fluoro = window.renderFluoroCaseStudy();
          require('./scientific-case-studies.js');
          require('./software-case-studies.js');
          const studies = [
            {html:fluoro,prefix:'fl',expected:5},
            {html:window.renderScientificCaseStudy(2),prefix:'sc-cam',expected:5},
            {html:window.renderScientificCaseStudy(3),prefix:'sc-clap',expected:11},
            {html:window.renderScientificCaseStudy(4),prefix:'sc-flag',expected:6},
            {html:window.renderScientificCaseStudy(5),prefix:'sc-card',expected:6},
            {html:window.renderScientificCaseStudy(6),prefix:'sc-stage',expected:7},
            {html:window.renderScientificCaseStudy(7),prefix:'sc-vision',expected:6}
          ];
          for (const study of studies) {
            const sourceLinks = [...study.html.matchAll(/class="study-cite" href="#([^"]+)"/g)].map(match => match[1]);
            const bibliography = [...study.html.matchAll(/<li id="(fl-ref-\d+|sc-cam-ref-\d+|sc-clap-ref-\d+)"/g)].map(match => match[1]);
            if(sourceLinks.length < 5 || bibliography.length !== study.expected ||
               sourceLinks.some(ref => !bibliography.includes(ref)) ||
               !study.html.includes('6.0 References') ||
               !study.html.includes('class="study-reference-list"')) {
              throw new Error('Broken or incomplete bibliography: ' + study.prefix);
            }
          }
          """
          subprocess.run(["node","-e",script],check=True)
          print("All seven report bibliographies and inline source links validated.")
          PY
          # Contact form must be accessible, designed, and actually wired to an email relay.
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          style=Path("contact-modern.css").read_text(encoding="utf-8")
          script=Path("contact-form.js").read_text(encoding="utf-8")
          assert 'id="portfolioContactForm"' in html
          assert 'action="https://formsubmit.co/kamenan.kume@eleves.ec-nantes.fr"' in html
          for field in ("contactName","contactEmail","contactTopic","contactSubject","contactMessage"):
              assert f'id="{field}"' in html, f"Missing required form field {field}"
          assert 'role="status" aria-live="polite"' in html
          assert 'name="_honey"' in html
          assert 'name="consent"' in html
          assert 'class="contact-layout"' in html and '#contact .contact-layout' in style
          assert 'id="projectsDashboard"' not in html, "Removed dashboard must stay absent"
          assert 'projects-dashboard.js?v=' not in html and 'projects-dashboard.css?v=' not in html, "Obsolete dashboard assets linked"
          assert 'contact-form.js?v=' in html and 'contact-modern.css?v=' in html
          assert 'function handleContact(e)' not in html
          assert "fetch(ENDPOINT" in script
          assert "Open email draft" in script
          print("Contact form markup, design, relay handling and fallback validated.")
          PY
          # Original credentials must appear directly after Education & Experience in About.
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          about_start = html.index('<section id="about"')
          about_end = html.index('<!-- ============ PROJECTS', about_start)
          about = html[about_start:about_end]
          assert 'id="credentials"' in about and 'Credentials &amp; Recognition' in about
          assert about.count('class="credential-card"') == 4, "Exactly four original credentials required"
          assert about.index('id="credentials"') > about.index('education-experience'), "Credentials must follow the education timeline"
          assert "grid-template-columns: repeat(2, 15cm)" in html
          assert "width: 15cm;" in html and "height: 15cm;" in html
          for image in (
              "SimpliLearn_Data_Science_Certificate.png",
              "Google_Advance_DA_Certificate.png",
              "Fire_Fighting_Robot_GALAXIA_3rd_Place_2022.png",
              "ISDC.jpg",
          ):
              assert image in about, f"Credential image missing: {image}"
          print("About credentials: four original assets in two 15 cm columns.")
          PY
          # Guard against previously deleted Home components reappearing.
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index('<section id="home"')
          end = html.index('<!-- ============ ABOUT ME', start)
          home = html[start:end]
          assert 'id="projectsDashboard"' not in home, "Removed dashboard returned to Home"
          assert 'class="cn-hero"' in home, "The Home hero is missing"
          assert 'class="cn-news"' in home, "Recent Work is missing"
          assert 'id="homeCredentials"' in home, "Home credential carousel is missing"
          assert home.index('id="homeCredentials"') > home.index('class="cn-news"'), "Credential carousel must follow Recent Work"
          assert home.count('class="hc-card"') == 4 and home.count('class="hc-dot"') == 4, "Wrong carousel card or navigation count"
          assert 'home-credentials.js?v=' in html and 'home-credentials.css?v=' in html, "Carousel assets not linked"
          assert 'id="credentials"' in html, "About credentials gallery must be retained"
          for forbidden in ('class="cn-evidence"', 'class="cn-journey"'):
              assert forbidden not in home, f"An obsolete Home section returned: {forbidden}"
          print("Home regression check passed: dashboard, metric cards and My Journey absent")
          PY
          # Prevent decorative labels and fixed project counters from returning.
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          forbidden = {
              "decorative kicker": r'class="kicker"',
              "project badge numbering": r'class="card-num"',
              "card year micro-label": r'class="card-year"',
              "detail eyebrow metadata": r'class="detail-eyebrow"',
              "fixed project count heading": r'(?i)three\s+projects',
              "hardcoded index over project total": r'Project\s+\$\{[^}]+\}\s*/\s*\$\{',
              "decorative case-study preheading": r'Technical Work\s*[—-]\s*Case Studies',
              "redundant case-study blurb": r'Each case study presents the context',
              "numbered blog note badge": r'NOTE\s+\$\{',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, html):
                  raise SystemExit(f"Portfolio copy regression: {label}")
          print("Portfolio copy audit passed (no decorative badges or fixed totals).")
          PY
          mkdir -p _site/lab
          cp index.html app.js content.js cv-data.json harvard-cv.js harvard-cv.css contact-form.js contact-modern.css home-credentials.js home-credentials.css styles.css atelier.css favicon.svg fluoroscopy-case-study.js fluoroscopy-case-study.css scientific-case-studies.js scientific-case-studies.css software-case-studies.js _site/
          cp lab/workspace.js lab/worker.js lab/compute.py _site/lab/
          cp -r assets _site/
          # Always publish the HTML even if an optional document rebuild fails.
          # Fall back to the last published copy of each PDF where available.
          for pdf in fluoroscopy-case-study.pdf camera-calibration-case-study.pdf clap-zero-shot-case-study.pdf flag-intelligence-case-study.pdf python-cardgame-case-study.pdf monstage-case-study.pdf visionlab-case-study.pdf Denos_Kume_Harvard_CV.pdf; do
            if [ -s "build/$pdf" ]; then
              cp "build/$pdf" "_site/$pdf"
            elif curl --fail --location --silent --show-error --retry 2 --max-time 30                 "https://denoskume.github.io/portfolio/$pdf?previous=1" -o "_site/$pdf"                 && head -c 5 "_site/$pdf" | grep -q '%PDF-'; then
              echo "Preserved previously deployed $pdf"
            else
              rm -f "_site/$pdf"
              echo "::warning::Could not generate or recover $pdf; deploying current website without this optional document."
            fi
          done
          test -s _site/cv-data.json
          test -s _site/harvard-cv.js
          test -s _site/harvard-cv.css
          test -s _site/contact-form.js
          test -s _site/contact-modern.css
          test -s _site/home-credentials.js
          test -s _site/home-credentials.css
          # Optional downloadable documents are checked independently from site publication.
          test -f _site/assets/denos-kume-signature.svg
          test -s _site/fluoroscopy-case-study.js
          test -s _site/fluoroscopy-case-study.css
          test -s _site/scientific-case-studies.js
          test -s _site/scientific-case-studies.css
          test -s _site/software-case-studies.js
          test -s _site/assets/case-studies/flag-intelligence-workflow.svg
          test -s _site/assets/case-studies/visionlab-workflow.svg
          test -s _site/assets/case-studies/visionlab-retained-arrays.svg
          test -s _site/assets/case-studies/monstage-workflow.svg
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published Home shows the latest content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          sha = os.environ["BUILD_SHA"]
          url = f"{base}/index.html?build={sha}"
          for attempt in range(8):
              try:
                  request = urllib.request.Request(
                      url, headers={"Cache-Control": "no-cache", "User-Agent": "Portfolio-Deployment-Check/1.0"}
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      html = response.read().decode("utf-8")
                  if ('id="projectsDashboard"' not in html
                      and 'projects-dashboard.js' not in html
                      and 'class="cn-evidence"' not in html
                      and 'class="cn-journey"' not in html
                      and 'id="credentials"' in html
                      and html.count('class="credential-card"') == 4
                      and 'id="homeCredentials"' in html
                      and html.count('class="hc-card"') == 4
                      and 'scientific-case-studies.js?v=' in html
                      and 'scientific-case-studies.css?v=' in html
                      and 'home-credentials.js?v=20261122-autoplay-visible-v5' in html
                      and 'home-credentials.css?v=' in html):
                      # Fetch the published script too: index.html being current
                      # is not sufficient if the asset is cached or missing.
                      script_url = f"{base}/home-credentials.js?build={sha}"
                      script_request = urllib.request.Request(
                          script_url,
                          headers={"Cache-Control": "no-cache",
                                   "User-Agent": "Portfolio-Deployment-Check/1.0"}
                      )
                      with urllib.request.urlopen(script_request, timeout=20) as js_response:
                          published_js = js_response.read().decode("utf-8")
                      assert "FIRST_SLIDE_DELAY = 900" in published_js, "Old autoplay script is still served"
                      assert "window.setInterval(autoplayTick, TICK)" in published_js, "Live autoplay is missing"
                      assert "outgoing.animate(" in published_js and "incoming.animate(" in published_js
                      print(f"Verified public Home and automatic carousel script at {url}")
                      break
                  print(f"Published HTML is still stale on attempt {attempt + 1}")
              except Exception as exc:
                  print(f"Public site check attempt {attempt + 1}: {exc}")
              time.sleep(8)
          else:
              raise SystemExit("Published Home did not reflect this commit; inspect Pages source and deployment logs")
          PY
