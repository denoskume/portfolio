name: Deploy standalone portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # A separate queue avoids a stale historical deployment blocking current fixes.
  group: portfolio-pages-current
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build downloadable project report PDF
        run: |
          python -m pip install --quiet reportlab pypdf
          python scripts/build_fluoroscopy_pdf.py
          test -s build/fluoroscopy-case-study.pdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path("build/fluoroscopy-case-study.pdf")
          reader = PdfReader(str(pdf))
          report = " ".join(" ".join(page.extract_text().split()) for page in reader.pages)
          required = ["Abstract", "Keywords", "Project information", "Nomenclature",
                      "1.0 Introduction", "3.0 Methodology", "4.2 Frame-by-frame results",
                      "5.0 Discussion and conclusion"]
          for heading in required:
              assert heading in report, f"PDF missing required section: {heading}"
          assert report.index("Project information") < report.index("Nomenclature") < report.index("1.0 Introduction")
          assert len(reader.pages) >= 4, "PDF report unexpectedly short"
          print(f"Validated downloadable report: {len(reader.pages)} pages, {pdf.stat().st_size} bytes")
          PY
      - name: Build and validate Harvard CV
        run: |
          python scripts/build_harvard_cv.py
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path("build/Denos_Kume_Harvard_CV.pdf")
          assert pdf.exists() and pdf.stat().st_size > 3000
          reader = PdfReader(str(pdf))
          assert len(reader.pages) == 1, "Harvard CV must fit exactly one page"
          page = reader.pages[0]
          assert abs(float(page.mediabox.width) - 595.28) < 1
          assert abs(float(page.mediabox.height) - 841.89) < 1
          text = " ".join((page.extract_text() or "").split())
          for required in (
              "Denos Kume", "Centrale Nantes", "Kristu Jayanti University",
              "RWS TrainAI", "Unified Mentor", "Data Science",
              "microcontroller hardware interfacing", "Business Intelligence",
              "February 2027", "Microcatheter Segmentation",
          ):
              assert required.lower() in text.lower(), f"Harvard PDF missing {required}"
          assert len(page.get("/Annots", [])) >= 3, "CV links are not clickable"
          assert "Baccalaureate" not in text and "Baccalauréat" not in text, "Secondary school should be excluded from internship CV"
          assert "Computer Vision & Image Processing" in text, "Missing focused Data Science direction"
          assert "Data Analysis" in text, "Missing secondary direction"
          assert "MonStage" not in text, "MonStage must not appear in the selected CV projects"
          assert "Microcatheter Segmentation" in text, "Missing selected computer vision project"
          assert "Feb - Apr 2026" in text, "CV project dates must be February–April 2026"
          assert "Master 1 project" in text and "Nantes, France (3 months)" in text, "CV project affiliation and duration must be visible"
          assert "Microcatheter Segmentation in Fluoroscopy | Python" not in text, "Project heading must not include technology tags"
          assert "CERTIFICATIONS" not in text.upper(), "CV certifications section should be removed"
          assert "Google Advanced Data Analytics" not in text, "Removed certification must not appear"
          assert "SQL Certification Course" not in text, "Removed certification must not appear"
          assert "EXPERIENCE" in text and "SELECTED PROJECTS" in text, "Missing reference sections"
          assert text.index("EDUCATION") < text.index("EXPERIENCE") < text.index("SELECTED PROJECTS") < text.index("TECHNICAL SKILLS"), "Incorrect reference CV section order"
          import json
          cv = json.loads(Path("cv-data.json").read_text(encoding="utf-8"))
          assert len(cv["education"]) == 2, "Show only higher education"
          assert cv["education"][0]["courses"] == "Artificial Intelligence | Machine Learning | Numerical Optimization | Data Analysis | Image Processing", "MSc coursework must match its description"
          assert cv["education"][1]["courses"] == "Programming | Database Systems | Data Analysis | Digital Electronics | Embedded Systems", "Bachelor coursework must match its description"
          assert "Digital Electronics" in text and "Embedded Systems" in text, "Bachelor electronics coursework must appear in the PDF"
          assert "Artificial Intelligence" in text and "Numerical Optimization" in text, "MSc AI and optimization coursework must appear in the PDF"
          assert len(cv["projects"]) == 1, "CV should showcase only one selected project"
          assert all(len(entry["bullets"]) == 4 for entry in cv["experience"] + cv["projects"]), "Every experience and selected project needs exactly 4 bullets"
          assert not any("MonStage" in entry["title"] for entry in cv["projects"])
          assert cv["career_headline"] == "Data Science | Computer Vision & Image Processing | Data Analysis"
          assert "certifications" not in cv, "CV data must not contain removed certifications"
          assert len(cv["experience"]) == 2
          assert all("organization" in job for job in cv["experience"]), "Experience affiliations must be present"
          assert all("|" not in job["title"] for job in cv["experience"]), "Job titles must not include employer and location"
          assert "Unified Mentor Pvt. Ltd." in text and "Bangalore, India" in text, "Missing internship affiliation and location"
          assert "RWS TrainAI" in text and "Remote (3 months)" in text, "Remote freelance affiliation and duration missing"
          assert "Sep - Dec 2024" in text and "Aug - Oct 2026" in text, "Experience date ranges must appear"
          assert cv["experience"][0]["dates"] == "Sep - Dec 2024", "Dates at right must not contain a month count"
          assert cv["experience"][1]["dates"] == "Aug - Oct 2026", "Dates at right must not contain a month count"
          assert all(job["organization"].endswith("(3 months)") for job in cv["experience"]), "Month count belongs on affiliation line, like the selected project"
          assert "Bangalore, India (3 months)" in text, "Missing duration in Unified Mentor affiliation"
          assert "Final-year Bachelor internship" in text, "Must retain Bachelor final-year internship qualification"
          assert "Final-year Bachelor internship" in cv["experience"][0]["summary"], "Preserve original summary data"
          print(f"Validated one-page text-based A4 Harvard CV: {len(text)} extracted characters")
          PY
      - name: Validate and prepare static site
        run: |
          node --check app.js
          node --check harvard-cv.js
          node --check contact-form.js
          node --check content.js
          node --check fluoroscopy-case-study.js
          node --check lab/workspace.js
          node --check lab/worker.js
          python -c 'from pathlib import Path; import re; html=Path("index.html").read_text(); Path("/tmp/portfolio-inline.js").write_text("\n".join(re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.I)), encoding="utf-8")'
          node --check /tmp/portfolio-inline.js
          # Contact form must be accessible, designed, and actually wired to an email relay.
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          style=Path("contact-modern.css").read_text(encoding="utf-8")
          script=Path("contact-form.js").read_text(encoding="utf-8")
          assert 'id="portfolioContactForm"' in html
          assert 'action="https://formsubmit.co/kamenan.kume@eleves.ec-nantes.fr"' in html
          for field in ("contactName","contactEmail","contactTopic","contactSubject","contactMessage"):
              assert f'id="{field}"' in html, f"Missing required form field {field}"
          assert 'role="status" aria-live="polite"' in html
          assert 'name="_honey"' in html
          assert 'name="consent"' in html
          assert 'class="contact-layout"' in html and '#contact .contact-layout' in style
          assert 'contact-form.js?v=' in html and 'contact-modern.css?v=' in html
          assert 'function handleContact(e)' not in html
          assert "fetch(ENDPOINT" in script
          assert "Open email draft" in script
          print("Contact form markup, design, relay handling and fallback validated.")
          PY
          # Prevent decorative labels and fixed project counters from returning.
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          forbidden = {
              "decorative kicker": r'class="kicker"',
              "project badge numbering": r'class="card-num"',
              "card year micro-label": r'class="card-year"',
              "detail eyebrow metadata": r'class="detail-eyebrow"',
              "fixed project count heading": r'(?i)three\s+projects',
              "hardcoded index over project total": r'Project\s+\$\{[^}]+\}\s*/\s*\$\{',
              "decorative case-study preheading": r'Technical Work\s*[—-]\s*Case Studies',
              "redundant case-study blurb": r'Each case study presents the context',
              "numbered blog note badge": r'NOTE\s+\$\{',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, html):
                  raise SystemExit(f"Portfolio copy regression: {label}")
          print("Portfolio copy audit passed (no decorative badges or fixed totals).")
          PY
          mkdir -p _site/lab
          cp index.html app.js content.js cv-data.json harvard-cv.js harvard-cv.css contact-form.js contact-modern.css styles.css atelier.css favicon.svg fluoroscopy-case-study.js fluoroscopy-case-study.css _site/
          cp lab/workspace.js lab/worker.js lab/compute.py _site/lab/
          cp -r assets _site/
          cp build/fluoroscopy-case-study.pdf _site/fluoroscopy-case-study.pdf
          cp build/Denos_Kume_Harvard_CV.pdf _site/Denos_Kume_Harvard_CV.pdf
          test -s _site/Denos_Kume_Harvard_CV.pdf
          test -s _site/cv-data.json
          test -s _site/harvard-cv.js
          test -s _site/harvard-cv.css
          test -s _site/contact-form.js
          test -s _site/contact-modern.css
          test -s _site/fluoroscopy-case-study.pdf
          test -f _site/assets/denos-kume-signature.svg
          test -s _site/fluoroscopy-case-study.js
          test -s _site/fluoroscopy-case-study.css
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
