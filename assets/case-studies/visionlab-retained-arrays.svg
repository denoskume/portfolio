<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="VisionLab retained image arrays benchmark: 8.64MB history versus 1.44MB final-only"><rect width="1200" height="510" fill="#f7f9fc"/><text x="40" y="56" font-family="Arial" font-size="31" font-weight="700" fill="#0b2745">Image arrays retained after a six-step pipeline</text><text x="40" y="92" font-family="Arial" font-size="18" fill="#526b86">1200 × 1200 RGB input · local synthetic benchmark · same final result</text><line x1="195" y1="365" x2="1034" y2="365" stroke="#aebed1" stroke-width="2"/><line x1="195" y1="150" x2="195" y2="365" stroke="#aebed1" stroke-width="2"/><rect x="320" y="154" width="220" height="211" rx="12" fill="#2c64ad"/><rect x="685" y="330" width="220" height="35" rx="8" fill="#1e8f9b"/><text x="430" y="135" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#0b2745">8.64 MB</text><text x="795" y="315" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#0b2745">1.44 MB</text><text x="430" y="399" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b2745">Full history arrays</text><text x="795" y="399" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b2745">Final-only batch arrays</text><rect x="916" y="170" width="236" height="85" rx="14" fill="#e2f1f1"/><text x="1034" y="211" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#187c85">6× fewer</text><text x="1034" y="236" text-anchor="middle" font-family="Arial" font-size="14" fill="#315f62">retained-array bytes</text><text x="40" y="471" font-family="Arial" font-size="16" fill="#526b86">Source: VisionLab benchmarks/results.json · retained arrays, not total process memory</text></svg>