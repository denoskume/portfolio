<script>
"use strict";
document.getElementById("unlock-form").addEventListener("submit",async function(event){
 event.preventDefault();
 const input=document.getElementById("access-key"),button=document.getElementById("unlock-button"),status=document.getElementById("unlock-status");
 const keyText=input.value.trim();status.textContent="";
 if(!/^[0-9a-fA-F]{64}$/.test(keyText)){status.textContent="Incorrect access key.";return;}
 button.disabled=true;
 try{
  if(!window.isSecureContext||!window.crypto||!crypto.subtle)throw new Error("Secure browser context required");
  const hex=s=>Uint8Array.from(s.match(/../g),v=>parseInt(v,16));
  const payload=document.getElementById("encrypted-article");
  const key=await crypto.subtle.importKey("raw",hex(keyText),{name:"AES-GCM"},false,["decrypt"]);
  const encrypted=Uint8Array.from(atob(payload.textContent.trim()),c=>c.charCodeAt(0));
  const buffer=await crypto.subtle.decrypt({name:"AES-GCM",iv:hex(payload.dataset.iv),tagLength:128},key,encrypted);
  const html=new TextDecoder("utf-8",{fatal:true}).decode(buffer);
  input.value="";
  document.open();document.write(html);document.close();
 }catch(error){status.textContent="Unable to unlock. Check your access key and use the HTTPS site.";button.disabled=false;input.select();}
});
</script></body></html>
